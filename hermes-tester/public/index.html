<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Hermes connectivity test</title>
<style>
  body { font-family: ui-sans-serif, system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; background: #0b0d12; color: #e6e9f0; }
  h1 { font-size: 1.1rem; margin-bottom: 0.25rem; }
  .sub { color: #8b95a8; font-size: 0.85rem; margin-bottom: 1rem; }
  .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.75rem; margin-right: 0.4rem; }
  .ok { background: rgba(74,222,128,0.15); color: #4ade80; }
  .bad { background: rgba(248,113,113,0.15); color: #f87171; }
  #log { border: 1px solid #2a3140; border-radius: 8px; height: 420px; overflow-y: auto; padding: 0.75rem; margin-bottom: 0.75rem; background: #12151d; }
  .msg { margin-bottom: 0.9rem; }
  .who { font-size: 0.75rem; color: #8b95a8; margin-bottom: 0.15rem; }
  .text { white-space: pre-wrap; }
  .tools { font-size: 0.75rem; color: #6ea8fe; margin-top: 0.3rem; }
  form { display: flex; gap: 0.5rem; }
  textarea { flex: 1; background: #12151d; color: #e6e9f0; border: 1px solid #2a3140; border-radius: 8px; padding: 0.5rem; resize: vertical; min-height: 2.5rem; font: inherit; }
  button { background: #6ea8fe; color: #0b0d12; border: none; border-radius: 8px; padding: 0 1rem; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <h1>Hermes connectivity test</h1>
  <div class="sub">
    Bypasses Jev with a hardcoded preset tool list — this only proves the Hermes/ACP
    connection works. <span id="status"><span class="badge">checking…</span></span>
  </div>

  <div id="log"></div>

  <form id="form">
    <textarea id="prompt" placeholder="Type a prompt for Hermes..." rows="2"></textarea>
    <button id="send" type="submit">Send</button>
  </form>

<script>
  const log = document.getElementById('log');
  const form = document.getElementById('form');
  const promptEl = document.getElementById('prompt');
  const sendBtn = document.getElementById('send');
  const statusEl = document.getElementById('status');

  function addMessage(who, text, toolCalls) {
    const div = document.createElement('div');
    div.className = 'msg';
    let html = '<div class="who">' + who + '</div><div class="text"></div>';
    div.innerHTML = html;
    div.querySelector('.text').textContent = text;
    if (toolCalls && toolCalls.length) {
      const t = document.createElement('div');
      t.className = 'tools';
      t.textContent = '🔧 ' + toolCalls.map((c) => c.label + ' (' + c.status + ')').join(', ');
      div.appendChild(t);
    }
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  async function refreshStatus() {
    try {
      const res = await fetch('/status');
      const data = await res.json();
      statusEl.innerHTML = data.connected
        ? '<span class="badge ok">connected</span>session ' + (data.sessionId ?? '')
        : '<span class="badge bad">not connected</span>';
    } catch {
      statusEl.innerHTML = '<span class="badge bad">server unreachable</span>';
    }
  }
  refreshStatus();
  setInterval(refreshStatus, 5000);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = promptEl.value.trim();
    if (!text) return;

    addMessage('you', text);
    promptEl.value = '';
    sendBtn.disabled = true;
    const thinking = document.createElement('div');
    thinking.className = 'msg';
    thinking.innerHTML = '<div class="who">hermes</div><div class="text">…</div>';
    log.appendChild(thinking);
    log.scrollTop = log.scrollHeight;

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ prompt: text }),
      });
      const data = await res.json();
      thinking.remove();
      if (!res.ok) {
        addMessage('error', data.error ?? 'unknown error');
      } else {
        addMessage('hermes', data.text || '(empty response)', data.toolCalls);
      }
    } catch (err) {
      thinking.remove();
      addMessage('error', String(err));
    } finally {
      sendBtn.disabled = false;
      refreshStatus();
    }
  });
</script>
</body>
</html>
